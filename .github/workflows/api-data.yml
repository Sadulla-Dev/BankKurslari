# Rebuilds the public API (api.qulaykurs.uz) and redeploys the Cloudflare Worker.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Scheduled runs only fire from the default branch (main).
name: API data

on:
  # Backend changes on main redeploy right away (full rebuild).
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api-data.yml"
  schedule:
    - cron: "0 * * * *"          # rates every hour
    - cron: "15 1,13 * * *"      # 06:15 and 18:15 Tashkent: full rebuild (branches, ATMs, CBU history)
  workflow_dispatch:
    inputs:
      mode:
        description: "rates or full"
        default: "full"

concurrency:
  group: api-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: backend
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          STATE_URL: https://api.qulaykurs.uz
          # Data problems (a bank stops publishing, bank.uz blocks us, stale rates) go to the owner on Telegram.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          YANDEX_PLACES_KEY: ${{ secrets.YANDEX_PLACES_KEY }}
          MODE: ${{ (github.event_name == 'push' || github.event.schedule == '15 1,13 * * *') && 'full' || inputs.mode || 'rates' }}
        run: node src/build.js "$MODE"
      - name: Deploy
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      # Owner-only alert when this workflow fails (the build's own data problems are sent by backend/src/alerts.js).
      # Needs secrets TELEGRAM_BOT_TOKEN and TELEGRAM_OWNER_CHAT_ID; without them it does nothing.
      - name: Tell the owner
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_OWNER_CHAT_ID" ] || exit 0
          curl -fsS -m 20 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_OWNER_CHAT_ID}" \
            --data-urlencode "text=❌ Qulay Kurs: \"${WORKFLOW}\" ishi yiqildi. ${RUN_URL}"
