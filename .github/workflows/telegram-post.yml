# Posts today's bank dollar rates (picture + caption) to the Telegram channel once a day.
# Needs repo secrets:
#   TELEGRAM_BOT_TOKEN  token from @BotFather; the bot must be an admin of the channel with "Post messages"
#   TELEGRAM_CHAT_ID    the channel, e.g. @qulaykurs (or its numeric id, -100…)
# Optional repo variable TELEGRAM_CHANNEL_HANDLE (e.g. @qulaykurs) is printed on the picture and in the caption.
name: Telegram post

on:
  # No `schedule` here: GitHub skipped scheduled runs. The qulaykurs-api Worker cron (backend/worker) dispatches
  # this workflow at 07:55 Tashkent, so the post lands around 8:00 — before banks open at 9:00.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not post"
        type: boolean
        default: false

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            backend
            web/public/bank-logos
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # ubuntu-latest ships Google Chrome; playwright-core drives it without downloading a browser.
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_HANDLE: ${{ vars.TELEGRAM_CHANNEL_HANDLE }}
        run: node scripts/telegram-post.mjs --out dollar-kursi.png ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dollar-kursi
          path: backend/dollar-kursi.png
          if-no-files-found: ignore
      # Owner-only alert when this workflow fails (the build's own data problems are sent by backend/src/alerts.js).
      # Needs secrets TELEGRAM_BOT_TOKEN and TELEGRAM_OWNER_CHAT_ID; without them it does nothing.
      - name: Tell the owner
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_OWNER_CHAT_ID" ] || exit 0
          curl -fsS -m 20 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_OWNER_CHAT_ID}" \
            --data-urlencode "text=❌ Qulay Kurs: \"${WORKFLOW}\" ishi yiqildi. ${RUN_URL}"
