<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Qulay Kurs — Play Market screenshotlari</title>
<!--
  Phone screens in app/*.png are real renders of the shared Compose UI with live data
  (store/app-shots). This page only frames them for the store. Render: node store/screenshots-src/render.js
-->
<style>
@font-face{font-family:Bric;src:url(../../composeApp/src/commonMain/composeResources/font/bricolage_semibold.ttf);font-weight:600}
@font-face{font-family:Bric;src:url(../../composeApp/src/commonMain/composeResources/font/bricolage_bold.ttf);font-weight:700}
@font-face{font-family:Inst;src:url(../../composeApp/src/commonMain/composeResources/font/instrument_regular.ttf);font-weight:400}
@font-face{font-family:Inst;src:url(../../composeApp/src/commonMain/composeResources/font/instrument_medium.ttf);font-weight:500}
@font-face{font-family:Inst;src:url(../../composeApp/src/commonMain/composeResources/font/instrument_semibold.ttf);font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:Inst,sans-serif;color:#121A1F;-webkit-font-smoothing:antialiased}
#wrap{display:flex;flex-wrap:wrap;gap:20px;padding:20px}

.slide{width:540px;height:960px;position:relative;overflow:hidden;background:#2F7A68}
.bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 85% 0%,#3E9580 0%,rgba(62,149,128,0) 60%),linear-gradient(170deg,#2F7A68 0%,#256656 55%,#1C5246 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.5px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 45%)}
.swoosh{position:absolute;left:-10%;right:-10%;bottom:-2px;height:520px;width:120%}
.head{position:absolute;left:0;right:0;top:50px;text-align:center;color:#fff;padding:0 34px;z-index:3}
.kicker{display:inline-flex;align-items:center;gap:8px;font:600 13px Inst;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.88);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:99px;margin-bottom:14px}
.kicker i{width:7px;height:7px;border-radius:50%;background:#F2C14E}
h1{font:700 39px/1.06 Bric;letter-spacing:-.025em}
h1 em{font-style:normal;color:#F2C14E}
.head p{font:400 17px/1.4 Inst;color:rgba(255,255,255,.84);margin-top:10px}

.phone{position:absolute;left:50%;top:248px;width:302px;margin-left:-151px;border-radius:42px;background:#0F1416;padding:9px;
  box-shadow:0 0 0 1.5px #2a3236 inset,0 40px 80px -20px rgba(6,30,24,.55),0 18px 36px -12px rgba(6,30,24,.35);z-index:2}
.screen{width:284px;border-radius:34px;overflow:hidden;position:relative;background:#F1F3F5}
.screen img.app{display:block;width:284px}
.sb{height:24px;display:flex;align-items:center;justify-content:space-between;padding:4px 22px 0 24px;font:600 11px Inter,sans-serif;color:#121A1F;background:#F1F3F5}
.sb.dim{background:#9ea3a6}
.cam{position:absolute;top:15px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#05080a;box-shadow:0 0 0 2px #1a2024;z-index:5}

.float{position:absolute;z-index:4;background:#fff;border-radius:18px;box-shadow:0 18px 40px -12px rgba(6,30,24,.45),0 2px 6px rgba(0,0,0,.08);padding:12px 14px}
.toast{display:flex;gap:10px;align-items:center}
.toast .ic{width:38px;height:38px;border-radius:11px;background:#2F7A68;display:grid;place-items:center;flex:none}
.t1{font:600 13.5px Inst}
.t2{font:400 12.5px Inst;color:#5A6670}

/* Android home-screen widget: a 1:1 copy of androidApp/res/layout/widget_rate.xml (light colors) */
.widget{background:#fff;border:1px solid #E3E6E8;border-radius:12px;padding:12px;font-family:Inter,Roboto,sans-serif;color:#0E1113;display:flex;flex-direction:column}
.widget .r1{display:flex;align-items:center;font-size:13px}
.widget .r1 b{flex:1;font-weight:700}
.widget .r1 span{color:#565E64}
.widget .r2{display:flex;align-items:center;flex:1;margin-top:4px}
.widget .col{flex:1;display:flex;flex-direction:column;font-size:13px;color:#565E64;min-width:0}
.widget .col strong{font-size:20px;font-weight:700;color:#0A7F56;line-height:1.25}
.widget .col em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget .div{width:1px;align-self:stretch;background:#E3E6E8;margin:0 8px}
.widget .cbu{font-size:13px;color:#565E64;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feature{width:1024px;height:500px;position:relative;overflow:hidden;background:#2F7A68}
</style>
</head>
<body>
<div id="wrap"></div>
<script>
const LOGO = `<svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#2F7A68"/><path d="M7.5 21.5l5.5-5.5 4 4 6.5-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23.8" cy="12.6" r="3" fill="#F2C14E"/></svg>`;
const BELL = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;
const sbIcons = c => `<span style="display:flex;gap:5px;align-items:center">
  <svg width="13" height="10" viewBox="0 0 16 12"><path d="M8 11.5 1 4.5a10 10 0 0 1 14 0z" fill="${c}"/></svg>
  <svg width="13" height="10" viewBox="0 0 16 12"><path d="M1 11h2V8H1zM5 11h2V6H5zM9 11h2V3H9zM13 11h2V0h-2z" fill="${c}"/></svg>
  <svg width="9" height="13" viewBox="0 0 9 14"><rect x="0" y="1.5" width="9" height="12.5" rx="2" fill="${c}"/><rect x="2.5" y="0" width="4" height="2" rx="1" fill="${c}"/></svg></span>`;
const TIME = '15:58';
const phone = (img, opt={}) => `<div class="phone" style="${opt.style||''}"><span class="cam"></span><div class="screen">
  <div class="sb ${opt.dim?'dim':''}"><span>${TIME}</span>${sbIcons('#121A1F')}</div><img class="app" src="app/${img}.png"></div></div>`;
const swoosh = flip => `<svg class="swoosh" viewBox="0 0 600 520" preserveAspectRatio="none" style="${flip?'transform:scaleX(-1)':''}">
  <path d="M0 210 C 140 120, 300 300, 600 150 L600 520 L0 520Z" fill="#fff" opacity=".10"/>
  <path d="M0 290 C 170 190, 330 380, 600 230 L600 520 L0 520Z" fill="#F4F6F5"/></svg>`;
const slide = (name, head, body, flip) => `<div class="slide" data-name="${name}"><div class="bg"></div><div class="dots"></div>${swoosh(flip)}
  <div class="head"><div class="kicker"><i></i>${head.k}</div><h1>${head.h}</h1>${head.p?`<p>${head.p}</p>`:''}</div>${body}</div>`;

/* Live values from api.qulaykurs.uz at render time (19.11.2026) — same numbers the app screens show. */
const W = { cur:'USD / soʻm', time:'10:58', sellLabel:'Dollar sotsangiz', sell:'11 960', sellBank:'Davr bank',
            buyLabel:'Dollar olsangiz', buy:'11 980', buyBank:'Asia Alliance Bank', cbu:'MB 11 980.36 soʻm · 19.11.2026' };
const widget = (w, extra='') => `<div class="widget" style="${extra}">
  <div class="r1"><b>${W.cur}</b><span>${W.time}</span></div>
  <div class="r2"><div class="col"><span>${W.sellLabel}</span><strong>${W.sell}</strong><em>${W.sellBank}</em></div><div class="div"></div>
  <div class="col"><span>${W.buyLabel}</span><strong>${W.buy}</strong><em>${W.buyBank}</em></div></div>
  <div class="cbu">${W.cbu}</div></div>`;

function homeScreen(){
  const apps = [['#E8EAED','📞'],['#E8EAED','💬'],['#E8EAED','📷'],['#E8EAED','🌐']];
  const icon = (bg, inner, label) => `<div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:58px">
     <div style="width:46px;height:46px;border-radius:50%;background:${bg};display:grid;place-items:center;overflow:hidden;font-size:20px">${inner}</div>
     <span style="font:500 10px Inter;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)">${label}</span></div>`;
  return `<div class="phone"><span class="cam"></span><div class="screen" style="height:616px;background:
      radial-gradient(90% 60% at 20% 15%,#7FB8A7 0%,rgba(127,184,167,0) 70%),radial-gradient(80% 60% at 90% 90%,#2C4F63 0%,rgba(44,79,99,0) 70%),linear-gradient(160deg,#4F8F7E,#22404A)">
    <div class="sb" style="background:transparent;color:#fff"><span>${TIME}</span>${sbIcons('#fff')}</div>
    <div style="padding:26px 22px 0;color:#fff">
      <div style="font:300 54px/1 Inter;letter-spacing:-.02em">${TIME}</div>
      <div style="font:500 13px Inter;opacity:.9;margin-top:6px">Payshanba, 19-noyabr · 12°C</div>
    </div>
    <div style="position:absolute;left:12px;right:12px;top:176px">${widget(1,'height:132px;box-shadow:0 8px 24px rgba(0,0,0,.18)')}</div>
    <div style="position:absolute;left:12px;right:12px;top:330px;display:flex;justify-content:space-around">
      ${icon('#fff', `<span style="width:46px;height:46px;display:block">${LOGO.replace('<svg','<svg width="46" height="46"')}</span>`, 'Qulay Kurs')}
      ${icon('#F4B400','🗺️','Xarita')}${icon('#fff','📅','Kalendar')}${icon('#fff','⚙️','Sozlamalar')}</div>
    <div style="position:absolute;left:18px;right:18px;bottom:66px;height:44px;border-radius:22px;background:rgba(255,255,255,.88);display:flex;align-items:center;padding:0 16px;gap:10px;font:500 13px Inter;color:#5A6670">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6670" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Qidirish</div>
    <div style="position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-around">
      ${apps.map(a=>`<div style="width:46px;height:46px;border-radius:50%;background:${a[0]};display:grid;place-items:center;font-size:20px">${a[1]}</div>`).join('')}</div>
  </div></div>`;
}

const S = [];
S.push(slide('01-kurs',{k:'29 bank · 1 ekran',h:'Qaysi bank <em>koʻproq</em><br>soʻm beradi?',p:'Summani kiriting — eng foydali bank darhol chiqadi'},
  phone('k1')));
S.push(slide('02-banklar',{k:'Reyting',h:'Barcha banklar<br><em>bitta roʻyxatda</em>',p:'Summa, masofa va ish vaqti boʻyicha saralang'},
  phone('k2'), true));
S.push(slide('03-xarita',{k:'Xarita',h:'Eng yaqin <em>foydali</em><br>filialni toping',p:'Kurs yozilgan pinlar va bir bosishda yoʻnalish'},
  phone('m1')));
S.push(slide('04-bank',{k:'Bank oynasi',h:'Har bir bank<br>haqida <em>hammasi</em>',p:'Olish va sotish kursi, eng yaqin filial, marshrut'},
  phone('k3-sheet',{dim:true}), true));
S.push(slide('05-vidjet',{k:'Android vidjeti',h:'Kurs <em>uy ekranida</em>',p:'Ilovani ochmasdan eng yaxshi kurs va MB kursi'},
  homeScreen() + `<div class="float" style="right:22px;top:690px;transform:rotate(3deg);padding:10px 12px;font:600 12.5px Inst;display:flex;align-items:center;gap:8px">
    <span style="width:8px;height:8px;border-radius:50%;background:#22B07D;box-shadow:0 0 0 4px rgba(34,176,125,.18)"></span>~30 daqiqada yangilanadi</div>`));
S.push(slide('06-tarix',{k:'Tarix',h:'Bugungi kurs<br><em>odatdagidek</em>mi?',p:'MB kursi 2009-yildan — interaktiv grafikda'},
  phone('t1'), true));
S.push(slide('07-ogohlantirish',{k:'Ogohlantirishlar',h:'Kurs kerakli<br>darajaga yetsa — <em>xabar</em>'},
  phone('t3') + `<div class="float toast" style="left:30px;right:30px;top:186px;border-radius:20px">
    <span class="ic">${BELL}</span><div style="flex:1"><div style="display:flex;justify-content:space-between"><span class="t1">USD ≤ 12 000 soʻm</span><span class="t2">Qulay Kurs · hozir</span></div>
    <div class="t2" style="color:#121A1F">Dollar olsangiz: Asia Alliance Bank 11 980 soʻm dan sotadi</div></div></div>`));
S.push(slide('08-oltin',{k:'Oltin',h:'Oltin quymalari<br><em>narxi</em> ham shu yerda',p:'Markaziy bank quymalari: narx, tarix va oʻzgarish'},
  phone('g1'), true));

S.push(`<div class="feature" data-name="feature-graphic">
  <div class="bg"></div><div class="dots" style="-webkit-mask-image:none"></div>
  <svg style="position:absolute;inset:0" width="1024" height="500" viewBox="0 0 1024 500"><path d="M520 500 C 620 380, 760 470, 1024 300 L1024 500Z" fill="#F4F6F5"/></svg>
  <div style="position:absolute;left:64px;top:92px;color:#fff;width:520px">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:26px"><span style="width:60px;height:60px;display:block">${LOGO.replace('<svg','<svg width="60" height="60"').replace('fill="#2F7A68"','fill="#fff"').replace('stroke="#fff"','stroke="#2F7A68"')}</span><span style="font:700 34px Bric;letter-spacing:-.02em">Qulay Kurs</span></div>
    <div style="font:700 50px/1.05 Bric;letter-spacing:-.03em">Valyutani qayerda<br>almashtirish <span style="color:#F2C14E">foydali?</span></div>
    <div style="font:400 20px Inst;color:rgba(255,255,255,.84);margin-top:18px">29 bank kursi · xarita · vidjet · MB tarixi · oltin</div>
  </div>
  <div style="position:absolute;left:660px;top:-40px;width:290px;transform:rotate(-6deg);border-radius:36px;background:#0F1416;padding:8px;box-shadow:0 40px 80px -20px rgba(6,30,24,.6)">
    <div style="border-radius:29px;overflow:hidden"><img src="app/k1.png" style="width:274px;display:block"></div></div>
</div>`);
document.getElementById('wrap').innerHTML = S.join('');
</script>
</body>
</html>
